  <script>
      document.addEventListener("DOMContentLoaded", function() {
          // Inline Math: unwrap `$...$` from <code> tags
          document.querySelectorAll('code').forEach(el => {
              if (el.parentElement.tagName === 'PRE') return;
              const text = el.textContent.trim();
              if (text.startsWith('$') && text.endsWith('$') && !text.startsWith('$$')) {
                  const span = document.createElement('span');
                  span.textContent = text;
                  el.replaceWith(span);
              }
          });
          if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
              MathJax.typesetPromise();
          }
      });
  </script>

  <script>
    function toggleSidebar() {
      var sidebar = document.getElementById("sidebar");
      var mask = document.getElementById("sidebar-mask");
      sidebar.classList.toggle("open");
      mask.classList.toggle("open");
    }

    const getPreferredScheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

    function updateThemeIcon(scheme) {
      const themeIcon = document.getElementById("theme-icon");
      if (themeIcon) {
        if (scheme === 'dark') {
          themeIcon.classList.remove("fa-moon");
          themeIcon.classList.add("fa-sun");
        } else {
          themeIcon.classList.remove("fa-sun");
          themeIcon.classList.add("fa-moon");
        }
      }
    }

    function toggleTheme() {
      const root = document.documentElement;
      const effectiveScheme = root.style.colorScheme || getPreferredScheme();
      const targetScheme = effectiveScheme === 'dark' ? 'light' : 'dark';

      root.style.colorScheme = targetScheme;
      localStorage.setItem("theme", targetScheme);
      updateThemeIcon(targetScheme);
    }

    // Initialize theme icon
    (function() {
      const savedTheme = localStorage.getItem("theme");
      const systemTheme = getPreferredScheme();
      updateThemeIcon(savedTheme || systemTheme);

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem("theme")) {
          updateThemeIcon(e.matches ? 'dark' : 'light');
        }
      });
    })();

    // Footnote Navigation & Code Block Processing
    document.addEventListener("DOMContentLoaded", function() {
        const MATH_LANGS = ['math', 'math-display', 'tex', 'latex'];

        // Process code blocks: create sticky headers
        document.querySelectorAll('pre code').forEach(code => {
            const pre = code.parentElement;
            let lang = pre.getAttribute('data-lang');

            if (!lang) {
                const codeLang = code.getAttribute('data-lang');
                if (codeLang) {
                    lang = codeLang;
                } else {
                    const classes = code.className.split(' ');
                    for (const cls of classes) {
                        if (cls.startsWith('language-')) {
                            lang = cls.replace('language-', '');
                            break;
                        }
                    }
                }
                if (lang) pre.setAttribute('data-lang', lang);
            }

            // Skip math blocks
            if (lang && MATH_LANGS.includes(lang.toLowerCase())) {
                const div = document.createElement('div');
                div.classList.add('math-display');
                let mathContent = code.textContent.trim();
                if (!mathContent.startsWith('$$') && !mathContent.startsWith('\\[')) {
                    mathContent = '$$' + mathContent + '$$';
                }
                div.textContent = mathContent;
                pre.replaceWith(div);
                return;
            }

            // Create sticky header
            if (!pre.querySelector('.code-header')) {
                const header = document.createElement('div');
                header.className = 'code-header';

                const dots = document.createElement('span');
                dots.className = 'code-dots';
                dots.innerHTML = '<span></span><span></span><span></span>';

                const right = document.createElement('span');
                right.className = 'code-header-right';

                if (lang) {
                    const langLabel = document.createElement('span');
                    langLabel.className = 'code-lang';
                    langLabel.textContent = lang.toUpperCase();
                    right.appendChild(langLabel);
                }

                const btn = document.createElement('button');
                btn.className = 'code-copy-btn';
                btn.setAttribute('aria-label', 'Copy code');
                btn.innerHTML = '<i class="fa-regular fa-copy"></i>';
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(code.textContent).then(() => {
                        btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                        setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
                    });
                });
                right.appendChild(btn);

                header.appendChild(dots);
                header.appendChild(right);
                pre.insertBefore(header, code);
            }
        });

        // Process Inline Math
        document.querySelectorAll(':not(pre) > code').forEach(code => {
            const text = code.textContent.trim();
            if ( (text.startsWith('$') && text.endsWith('$') && !text.startsWith('$$')) ||
                 (text.startsWith('\\(') && text.endsWith('\\)')) ) {
                 const span = document.createElement('span');
                 span.textContent = text;
                 code.replaceWith(span);
            }
        });

        // Motto typewriter (all [data-mottos] elements)
        document.querySelectorAll('[data-mottos]').forEach(function(el) {
            var mottos = JSON.parse(el.dataset.mottos);
            if (!mottos || mottos.length === 0) return;
            // Reduced motion: render the first motto statically, no typing loop.
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                el.textContent = mottos[0];
                return;
            }
            var idx = 0, charIdx = 0, deleting = false;
            function tick() {
                var current = mottos[idx];
                if (!deleting) {
                    charIdx++;
                    el.textContent = current.substring(0, charIdx);
                    if (charIdx === current.length) {
                        deleting = true;
                        setTimeout(tick, 2500);
                        return;
                    }
                    setTimeout(tick, 80 + Math.random() * 40);
                } else {
                    charIdx--;
                    el.textContent = current.substring(0, charIdx);
                    if (charIdx === 0) {
                        deleting = false;
                        idx = (idx + 1) % mottos.length;
                        setTimeout(tick, 400);
                        return;
                    }
                    setTimeout(tick, 35);
                }
            }
            tick();
        });
    });
  </script>
